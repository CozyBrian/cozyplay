# xcodegen spec — regenerate the Xcode project with:  xcodegen generate
name: cozyplay
options:
  bundleIdPrefix: africa.inpathgroup
  deploymentTarget:
    macOS: "14.4"          # Core Audio process-tap API floor (macOS 14.4+)
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5"      # skeleton uses Swift 5 language mode; tighten to 6 later
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  cozyplay:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: africa.inpathgroup.cozyplay
        PRODUCT_NAME: cozyplay
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/cozyplay.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Engine/RTAtomics.h
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  # Logic tests: compiles the engine/audio/model sources directly (no app host,
  # so tests run headless without launching UI or triggering TCC prompts).
  cozyplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "App/**"
          - "Views/**"
          - "Controllers/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: africa.inpathgroup.cozyplayTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Engine/RTAtomics.h

schemes:
  cozyplay:
    build:
      targets:
        cozyplay: all
    test:
      targets:
        - cozyplayTests
